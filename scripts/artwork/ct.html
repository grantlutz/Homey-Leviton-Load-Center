<!doctype html><html><head><style>html,body{margin:0;padding:0}</style></head><body>
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e9ef"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f5260"/>
      <stop offset="1" stop-color="#22303a"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a444d"/>
      <stop offset="0.5" stop-color="#242d34"/>
      <stop offset="1" stop-color="#171e24"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#31424e" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- cable, straight through the clamp -->
  <g filter="url(#soft)">
    <rect x="440" y="30" width="120" height="940" rx="60" fill="url(#cable)"/>
    <rect x="462" y="50" width="18" height="900" rx="9" fill="#4a555f" opacity="0.7"/>
  </g>

  <!-- current direction chevrons on the cable, above the clamp -->
  <g stroke="#33c1ff" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M 468 96 L 500 132 L 532 96"/>
    <path d="M 468 168 L 500 204 L 532 168"/>
  </g>

  <!-- pigtail leads from the clamp to the meter connector -->
  <g fill="none" stroke-linecap="round">
    <path d="M 330 750 C 250 830 235 870 260 930" stroke="#dfe6ec" stroke-width="20"/>
    <path d="M 362 776 C 292 850 280 884 300 942" stroke="#31424e" stroke-width="20"/>
  </g>
  <rect x="236" y="912" width="110" height="62" rx="14" fill="#31424e"/>
  <rect x="258" y="928" width="66" height="30" rx="8" fill="#0098DB"/>

  <!-- CT clamp ring, face-on around the cable -->
  <g filter="url(#soft)">
    <circle cx="500" cy="560" r="250" fill="none" stroke="url(#ring)" stroke-width="130"/>
    <!-- inner + outer rim lines for depth -->
    <circle cx="500" cy="560" r="315" fill="none" stroke="#1a252d" stroke-width="6"/>
    <circle cx="500" cy="560" r="185" fill="none" stroke="#152028" stroke-width="6"/>
    <!-- hinge (left) -->
    <rect x="168" y="512" width="90" height="96" rx="22" fill="#22303a"/>
    <circle cx="213" cy="560" r="16" fill="#4a5a66"/>
    <!-- latch (right) with blue release clip -->
    <rect x="742" y="512" width="90" height="96" rx="22" fill="#2b3a45"/>
    <rect x="766" y="534" width="44" height="52" rx="10" fill="#0098DB"/>
    <!-- LED -->
    <circle cx="500" cy="310" r="16" fill="#33c1ff" filter="url(#glow)"/>
  </g>

</svg>
</body></html>
